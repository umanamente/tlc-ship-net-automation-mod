name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        name: Check the squash commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ($env:PR_TITLE -cnotmatch '^(feat|fix|perf|revert|refactor|docs|test|build|ci|style|chore)(\([^)]+\))?!?: \S') {
            throw 'Use a Conventional Commit title, for example fix(winch): resume after recharge'
          }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/native_assets.py check
      - run: python -m unittest discover -s tests
      - run: python tools/package_mod.py

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tested_sha: ${{ github.sha }}
